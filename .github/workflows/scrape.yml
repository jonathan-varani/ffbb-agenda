name: Scrape FFBB — région GES

on:
  schedule:
    # 8h00 et 23h00 heure de Paris = 6h00 et 21h00 UTC (heure d'été)
    # ⚠️ GitHub Actions ne gère que l'UTC : décaler d'1h en hiver (heure d'hiver = UTC+1)
    - cron: "0 6 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}   # permet un lancement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le scraping (région GES)
        run: python generate_ics.py --region "https://competitions.ffbb.com/ligues/ges"

      - name: Commit + push si changements
        run: |
          git config user.name "ffbb-bot"
          git config user.email "actions@github.com"
          git add docs/calendars docs/calendars.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Auto: mise à jour calendriers FFBB $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Un autre run (nationaux, départements, ou un push manuel) peut avoir
            # poussé entre-temps. docs/calendars.json est réécrit intégralement par
            # le script à partir de sa propre lecture du fichier : un simple rebase
            # peut donc entrer en conflit sur ce fichier. En cas de conflit, on
            # abandonne le rebase et on régénère par-dessus le dernier état distant
            # plutôt que de rejouer le même rebase en boucle.
            success=false
            for i in 1 2 3 4 5; do
              if git push; then
                success=true
                break
              fi
              echo "Push rejeté, nouvel essai ($i/5)…"
              sleep $((RANDOM % 10 + 5))
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Conflit de rebase : régénération depuis origin/main."
                git rebase --abort
                git reset --hard origin/main
                python generate_ics.py --region "https://competitions.ffbb.com/ligues/ges"
                git add docs/calendars docs/calendars.json
                git commit -m "Auto: mise à jour calendriers FFBB $(date -u +'%Y-%m-%d %H:%M UTC')"
              fi
            done
            if [ "$success" = false ]; then
              echo "::error::Échec du push après 5 tentatives."
              exit 1
            fi
          fi
