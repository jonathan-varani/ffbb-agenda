name: Scrape FFBB — championnats nationaux

on:
  schedule:
    # 23h00 heure de Paris = 21h00 UTC (heure d'été)
    # ⚠️ GitHub Actions ne gère que l'UTC : décaler d'1h en hiver (heure d'hiver = UTC+1)
    - cron: "0 21 * * *"
  workflow_dispatch: {}   # permet un lancement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  scrape-national:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le scraping (championnats nationaux)
        run: python generate_ics.py --national

      - name: Commit + push si changements
        run: |
          git config user.name "ffbb-bot"
          git config user.email "actions@github.com"
          git add docs/calendars docs/calendars.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Auto: mise à jour calendriers nationaux FFBB $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Un autre run (région GES, ou un push manuel) peut avoir poussé entre-temps :
            # on rebase sur origin/main avant de pousser, avec quelques tentatives.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push rejeté, nouvel essai ($i/5)…"
              sleep $((RANDOM % 10 + 5))
            done
          fi
