name: Scrape FFBB — championnats nationaux

on:
  schedule:
    # 23h15 heure de Paris = 21h15 UTC (heure d'été)
    # ⚠️ GitHub Actions ne gère que l'UTC : décaler d'1h en hiver (heure d'hiver = UTC+1)
    # Décalé de 15 min par rapport au scrape régional GES (21h00 UTC) pour éviter
    # que les deux workflows poussent en même temps sur docs/calendars.json.
    - cron: "15 21 * * *"
  workflow_dispatch: {}   # permet un lancement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  scrape-national:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le scraping (championnats nationaux)
        run: python generate_ics.py --national

      - name: Commit + push si changements
        run: |
          set -x
          git config user.name "ffbb-bot"
          git config user.email "actions@github.com"
          git status --porcelain
          git add docs/calendars docs/calendars.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Auto: mise à jour calendriers nationaux FFBB $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Un autre run (région GES, ou un push manuel) peut avoir poussé entre-temps.
            # docs/calendars.json est réécrit intégralement par le script à partir de
            # sa propre lecture du fichier : un simple rebase peut donc entrer en
            # conflit sur ce fichier. En cas de conflit, on abandonne le rebase et on
            # régénère par-dessus le dernier état distant plutôt que de rejouer le
            # même rebase en boucle.
            success=false
            for i in 1 2 3 4 5; do
              if git push; then
                success=true
                break
              fi
              echo "Push rejeté, nouvel essai ($i/5)…"
              sleep $((RANDOM % 10 + 5))
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Conflit de rebase : régénération depuis origin/main."
                git rebase --abort
                git reset --hard origin/main
                python generate_ics.py --national
                git add docs/calendars docs/calendars.json
                git commit -m "Auto: mise à jour calendriers nationaux FFBB $(date -u +'%Y-%m-%d %H:%M UTC')"
              fi
            done
            if [ "$success" = false ]; then
              echo "::error::Échec du push après 5 tentatives."
              exit 1
            fi
          fi
